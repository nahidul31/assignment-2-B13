<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Wave</title>
    <!-- font awesome  -->
    <script src="https://kit.fontawesome.com/5e46bfaef3.js" crossorigin="anonymous"></script>
    <!-- //add tailwind css- -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
    </style>
    <link rel="stylesheet" href="./style/style.css">
</head>

<body class="text-[var(--text-color)]">
    <!-- navbar part------------------------------------------ -->
    <nav
        class="bg-[#1A0B2E] p-3 px-5 lg:p-6 lg:px-20 flex items-center justify-between border-b-2 border-indigo-400 shadow-">


        <h1 class=" text-2xl lg:text-4xl font-bold">
            Tech<span class="bg-[linear-gradient(90deg,#f7e93f,#fb09b4,#9100f8)]
         bg-clip-text text-transparent hover:opacity-80">Wave</span>
        </h1>


        <ul class="hidden sm:flex gap-8 font-semibold ">
            <li>About</li>
            <li>Episodes</li>
            <li>Host</li>
        </ul>


        <button class="hidden sm:block bg-[linear-gradient(90deg,#f7e93f,#fb09b4,#9100f8)] 
                 p-2 rounded-full px-4 text-white">
            Subscribe
        </button>


        <div class="block sm:hidden">
            <button class="text-white p-2 text-2xl">
                <img src="./assets/hamburger-menu.png" alt="" srcset="">
            </button>
        </div>

    </nav>

    <!-- Banner section ------------------------------------------------------- -->
    <!-- <section class="bg-[url(./assets/hero-bg.png)] "> -->
    <section class="relative">
        <img src="./assets/hero-bg.png" alt="" srcset="">
        <div class="absolute -top-5  w-full h-full flex flex-col justify-center items-center">
            <img src="./assets/hero-circle.png" alt="" srcset="">
            <img class="absolute top-40" src="./assets/microphone.png" alt="" srcset="">

            <h1 class="text-5xl font-bold mt-10">TechWave</h1>
            <p class="mt-3">Your daily dose of tech insights, productivity hacks, and personal growth</p>

            <div class="font-semibold mt-5 flex space-x-3">
                <button class=" flex items-center space-x-2 bg-[linear-gradient(90deg,#f7e93f,#fb09b4,#9100f8)] 
                 p-2 rounded-full px-5 text-white">
                    <img src="./assets/spotify.png" alt=""> <span>Listen On Spotify</span>
                </button>

                <button class="flex items-center space-x-2 border-2 text-[#00FF88] p-2 px-5 rounded-full">
                    <img src="./assets/message.png" alt="" srcset=""> <span>Subscribe</span></button>
            </div>

        </div>

    </section>

</body>

</html>
